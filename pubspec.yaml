name: flutterttsreader
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5

  # State Management & DI
  flutter_riverpod: ^3.3.2

  # Core Audio Stack
  just_audio: ^0.10.5
  audio_service: ^0.18.12
  flutter_tts: ^4.1.0

  # File Processing & Utilities
  file_picker: ^11.0.2
  path_provider: ^2.1.3
  archive: ^4.0.9 

  # Local Storage Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  flutter_lints: ^6.0.0

environment:
  sdk: '^3.12.0'

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - unawaited_futures
    - avoid_unnecessary_containers
